[package]
name = "lazy-aws"
version = "0.3.0"
edition = "2021"
description = "A TUI for interacting with AWS services, inspired by lazygit"
license = "MIT"
readme = "README.md"
keywords = ["aws", "ecs", "ssm", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
log = "0.4"
dirs = "6"
which = "8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
fuzzy-matcher = "0.3"
ansi-to-tui = "8"
base64 = "0.22"
chrono = "0.4"
portable-pty = "0.9"
vt100 = "0.16"
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
